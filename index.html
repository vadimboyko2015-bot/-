<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Солнечная электростанция: от фотона до сети</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06122b;color:#fff;font:15px/1.35 "SF Pro Display",Inter,system-ui,sans-serif;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.g{position:fixed;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.07));backdrop-filter:blur(18px) saturate(1.7);-webkit-backdrop-filter:blur(18px) saturate(1.7);border:1px solid rgba(255,255,255,.4);border-radius:22px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -10px 24px rgba(255,255,255,.05),0 12px 40px rgba(0,10,40,.45);text-shadow:0 1px 4px rgba(0,0,30,.6)}

button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:7px 12px;cursor:pointer;transition:.2s}

#card h3{margin:0 0 6px;color:#ffd36b}#card p{margin:0}
</style></head><body>
<canvas id="c"></canvas><div class="g" id="stage"></div><canvas id="f"></canvas>
<div class="g" id="top"><h1>☀ Солнечная электростанция</h1><div id="chips"></div><button id="tc">Панель</button><button id="ts">Накопитель</button><button id="demo">▶ Автодемо</button><button id="pause"></button><button id="reset">Сброс</button><button id="lab">Подписи</button></div>
<div class="g" id="side"></div><div class="g" id="cap"></div><div class="g" id="wid"></div>
<div class="g" id="card"><h3></h3><p></p></div>
<script>
// ===== Canvas: фон (небо, поле) и передний план (схема) =====
const $=s=>document.querySelector(s),cb=$('#c'),cf=$('#f'),bg=cb.getContext('2d'),fg=cf.getContext('2d');
let X=bg,W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;[cb,cf].forEach(c=>{c.width=W*D;c.height=H*D;c.getContext('2d').setTransform(D,0,0,D,0,0)})}
addEventListener('resize',rs);rs();
const mx=(a,b,t)=>a+(b-a)*t,cl01=v=>Math.max(0,Math.min(1,v)),rnd=Math.random;
const C=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),rgb=a=>`rgb(${a.map(Math.round)})`;
const hm=t=>{t=(t%24+24)%24;return String(t|0).padStart(2,'0')+':'+String(t%1*60|0).padStart(2,'0')};
// ===== Тексты =====
const ST=['Шаг 1. Фотоны падают на стекло под углом, зависящим от времени суток; ~4 % отражается, просветляющее покрытие снижает потери.',
'Шаг 2. Свет проходит слои: стекло → плёнка EVA → просветляющее покрытие → n‑кремний → p‑n переход → p‑кремний → задний контакт.',
'Шаг 3. Фотон рвёт связь Si–Si: появляются свободный электрон и «дырка» (справа — кристалл крупно).',
'Шаг 4. Электрическое поле p‑n перехода разводит заряды: электроны уходят в n‑слой, дырки — в p‑слой.',
'Шаг 5. Электроны идут по контактам через нагрузку (лампу) и возвращаются в задний контакт — цепь замкнута, ток течёт навстречу им.',
'Шаг 6. Инвертор превращает постоянный ток в переменный, трансформатор повышает напряжение и отдаёт энергию в сеть.',
'Накопитель, день: излишек электричества греет известняк: CaCO₃ → CaO + CO₂. Энергия запасается в химических связях.',
'Накопитель, ночь: CaO + CO₂ → CaCO₃ + тепло. Тепло греет теплообменник → пар → электричество для потребителей.'];
const INFO={glass:['Защитное стекло','Закалённое стекло защищает от града и погоды, пропускает ~96 % света.'],
eva:['Плёнка EVA','Прозрачный полимер: приклеивает стекло к элементу и защищает от влаги.'],
arc:['Просветляющее покрытие','Тонкая плёнка нитрида кремния: без неё кремний отражал бы ~30 % света.'],
n:['n‑слой кремния','Тонкий слой с примесью фосфора: много свободных электронов.'],
pn:['p‑n переход','Граница слоёв. Здесь возникает встроенное электрическое поле: оно толкает электроны вверх, в n‑слой, а дырки вниз, в p‑слой.'],
p:['p‑слой кремния','Толстый слой с примесью бора, избыток «дырок». Здесь поглощается большая часть света.'],
back:['Задний контакт','Алюминиевый слой (плюс элемента). Сюда возвращаются электроны из цепи и соединяются с дырками.'],
finger:['Контакты‑«шины»','Тонкие серебряные дорожки собирают электроны с поверхности и почти не затеняют элемент.'],
lamp:['Нагрузка','Электроны проходят по цепи и совершают работу: лампа светит тем ярче, чем больше мощность. Условный ток направлен от «+» к «−», навстречу электронам.'],
lat:['Кристалл кремния','Каждый атом Si связан с четырьмя соседями. Фотон с энергией выше ~1,1 эВ рвёт связь: электрон свободен, остаётся дырка.'],
cell:['Ячейка','Одна ячейка даёт около 0,6 В; в панели их 60–72, соединённых последовательно.'],
panel:['Панель','Напряжение ячеек складывается: около 30–40 В на панель.'],
string:['Строка панелей','Панели в ряд: напряжение растёт с их числом, ток зависит от освещённости.'],
inv:['Инвертор','Превращает постоянный ток (DC) в переменный 50 Гц (AC) и держит панели в точке максимальной мощности.'],
trans:['Трансформатор','Повышает напряжение, чтобы отдавать мощность в сеть с малыми потерями.'],
grid:['Сеть','Электричество идёт потребителям. Если выработка больше нагрузки, излишек уходит в накопитель.'],
reac:['Реактор с известняком','Днём излишек электричества нагревает CaCO₃ до ~900 °C: он распадается на CaO и CO₂, энергия запасается в связях. Ночью обратная реакция выделяет тепло. Известняк дёшев, негорюч и хранится годами без потерь.'],
co2:['Резервуар CO₂','Газ хранится отдельно и ночью возвращается в реактор. Цикл замкнут, углерод не выбрасывается.'],
hx:['Теплообменник','Тепло реакции греет воду → пар → турбина → электричество ночью.']};
// ===== Состояние =====
const DEF={t:11,cl:10,tilt:35,tp:35,dust:10,n:20,load:300,sp:1},CAP=4;
let S={...DEF},tab='c',step=1,paused=false,labels=true,demo=-1,dT=0,E=2,day=0,clock=0,Tr=200,M={},hits=[],ps=[],fl=[],acc=0,geo=null;
const stars=Array.from({length:140},()=>[rnd(),rnd(),rnd()]);
const chunks=Array.from({length:30},()=>[rnd(),rnd(),.05+rnd()*.05,rnd()*6]).sort((a,b)=>b[1]-a[1]);
const DM=[1,2,3,4,5,6].map(n=>({tab:'c',n,t:n==1?11.3:null,d:5})).concat([{tab:'s',t:11,e:1.2,d:9},{tab:'s',t:21,e:3,d:9}]);
// ===== Интерфейс =====
const SL=[['t','Время суток',0,24,.1],['cl','Облачность, %',0,100,1],['tilt','Наклон панелей, °',0,90,1],['tp','Температура панели, °C',0,90,1],['dust','Запылённость, %',0,100,1],['n','Панелей в строке',4,30,1],['load','Нагрузка, кВт',0,1000,10],['sp','Скорость анимации',0,3,.1]];
$('#side').innerHTML=SL.map(([k,l,a,b,s])=>`<div><label>${l}<b id="v${k}"></b></label><input type=range id="s${k}" min=${a} max=${b} step=${s}></div>`).join('');
SL.forEach(([k])=>{$('#s'+k).oninput=e=>{S[k]=+e.target.value;sync()}});
function sync(){SL.forEach(([k])=>{$('#s'+k).value=S[k];$('#v'+k).textContent=k=='t'?hm(S.t):S[k]})}
$('#chips').innerHTML=[1,2,3,4,5,6].map(i=>`<button data-i="${i}">${i}</button>`).join('');
$('#wid').innerHTML=[['Время','wt'],['Солнце над горизонтом','we'],['Мощность','wp'],['Напряжение / ток','wv'],['КПД панели','wn'],['Выработка за день','wd'],['Накопитель','ws']].map(([l,i])=>`<div class="w"><small>${l}</small><b id="${i}"></b></div>`).join('');
const set=(i,v)=>{const el=document.getElementById(i);if(el.textContent!==v)el.textContent=v};
function ui(){$('#tc').classList.toggle('on',tab=='c');$('#ts').classList.toggle('on',tab=='s');document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',tab=='c'&&+b.dataset.i==step));$('#lab').classList.toggle('on',labels);$('#demo').classList.toggle('on',demo>=0);$('#pause').textContent=paused?'▶ Пуск':'⏸ Пауза'}
function apply(){if(demo>=DM.length){demo=-1;ui();return}const d=DM[demo];tab=d.tab;if(d.n)step=d.n;if(d.t!=null)S.t=d.t;if(d.e!=null)E=d.e;dT=d.d;ui();sync()}
$('#tc').onclick=()=>{tab='c';demo=-1;ui()};$('#ts').onclick=()=>{tab='s';demo=-1;ui()};
$('#chips').onclick=e=>{const i=e.target.dataset.i;if(i){step=+i;tab='c';demo=-1;ui()}};
$('#demo').onclick=()=>{S.cl=10;S.load=300;S.sp=1;paused=false;demo=0;apply()};
$('#pause').onclick=()=>{paused=!paused;ui()};
$('#reset').onclick=()=>{S={...DEF};E=2;day=0;demo=-1;step=1;tab='c';paused=false;ps.length=0;sync();ui()};
$('#lab').onclick=()=>{labels=!labels;ui()};
const fnd=e=>{for(let i=hits.length;i--;){const h=hits[i];if(e.clientX>=h[1]&&e.clientX<=h[1]+h[3]&&e.clientY>=h[2]&&e.clientY<=h[2]+h[4])return h[0]}};
cf.onmousemove=e=>cf.style.cursor=fnd(e)?'pointer':'';
cf.onclick=e=>{const k=fnd(e),c=$('#card');if(k){c.children[0].textContent=INFO[k][0];c.children[1].textContent=INFO[k][1];c.style.display='block'}else c.style.display='none'};
$('#card').onclick=()=>$('#card').style.display='none';
// ===== Модель: излучение, КПД, мощность =====
function calc(){
 const r=Math.PI/180,e=Math.sin((S.t-6)/12*Math.PI)*68; // высота Солнца, °
 const inc=e>0?Math.max(0,Math.cos((e-(90-S.tilt))*r)):0; // косинус угла падения на панель
 const G=e>0?1000*Math.pow(Math.sin(e*r),.4)*(1-.75*S.cl/100)*(1-.3*S.dust/100)*inc:0; // Вт/м²
 const eta=.21*(1-.004*(S.tp-25)),A=S.n*170,p=G*A*eta/1000; // КПД падает с нагревом; 100 строк × n панелей × 1,7 м²
 const V=G>5?S.n*31*(1-.0028*(S.tp-25))*(.9+.1*Math.min(1,G/600)):0;
 Object.assign(M,{e,G,eta,A,p,V,I:V?p*1000/V:0});
}
// ===== Частицы: фотоны, электроны, дырки =====
function pair(x,y){const g=geo,nm=g.Y(65),xf=g.fx.reduce((b,f)=>Math.abs(f-x)<Math.abs(b-x)?f:b);
 ps.push({k:'e',x,y,i:0,pt:[[x,nm],[xf,nm],[xf,g.busY],[g.lampX,g.busY],[g.lampX,g.backY],[g.RX,g.backY]]},{k:'h',x,y})}
function sim(a){
 if(!geo||tab!='c'){ps.length=0;return}
 const g=geo,r=Math.PI/180;
 if(M.G>3&&ps.length<350){acc+=a*M.G/1000*22;while(acc>=1){acc--;
  const ang=(S.t<12?1:-1)*Math.min(55,Math.max(8,(90-M.e)*.6))*r,v=240*g.u,L=110*g.u,hx=g.cx+rnd()*g.cw;
  ps.push({k:'g',x:hx-Math.tan(ang)*L,y:g.sy-L,vx:Math.sin(ang)*v,vy:Math.cos(ang)*v,ang,v,ya:g.Y(70+rnd()*rnd()*98),s:0})}}
 ps.forEach(p=>{
  if(p.k=='g'){p.x+=p.vx*a;p.y+=p.vy*a;
   if(!p.s&&p.y>=g.sy){p.s=1;if(rnd()<.05)ps.push({k:'r',x:p.x,y:g.sy,vx:p.vx*.8,vy:-p.vy*.8,l:1});p.vx=Math.sin(p.ang*.5)*p.v*.8;p.vy=Math.cos(p.ang*.5)*p.v*.8}
   if(p.y>=p.ya){p.dead=1;fl.push({x:p.x,y:p.y,l:1});pair(p.x,p.y)}}
  else if(p.k=='r'){p.x+=p.vx*a;p.y+=p.vy*a;p.l-=a*1.1;if(p.l<=0)p.dead=1}
  else if(p.k=='e'){const q=p.pt[p.i],dx=q[0]-p.x,dy=q[1]-p.y,d=Math.hypot(dx,dy),s=(p.i?170:230)*g.u*a;if(d<=s){p.x=q[0];p.y=q[1];if(++p.i>=p.pt.length)p.dead=1}else{p.x+=dx/d*s;p.y+=dy/d*s}}
  else{p.y+=60*g.u*a;if(p.y>=g.Y(175))p.dead=1}});
 ps=ps.filter(p=>!p.dead);fl=fl.filter(f=>(f.l-=a*2)>0);
}
// ===== Рисование: помощники =====
const hit=(k,x,y,w,h)=>hits.push([k,x,y,w,h]);
const rr=(x,y,w,h,r)=>{X.beginPath();X.roundRect?X.roundRect(x,y,w,h,r):X.rect(x,y,w,h)};
function tt(s,x,y,sz=14,al='left',c='#fff'){X.font=`600 ${sz}px "SF Pro Display",Inter,system-ui,sans-serif`;X.textAlign=al;X.fillStyle=c;X.shadowColor='rgba(0,10,40,.8)';X.shadowBlur=6;X.fillText(s,x,y);X.shadowBlur=0}
function gl(on,x,y,w,h,r=16){if(!on)return;X.save();X.strokeStyle=`rgba(255,210,90,${.65+.35*Math.sin(clock*6)})`;X.lineWidth=3;X.shadowColor='#ffc83d';X.shadowBlur=24;rr(x,y,w,h,r);X.stroke();X.restore()}
// ===== Фон: небо, Солнце, звёзды, облака =====
function sky(){
 const e=M.e,dk=cl01((e+5)/22),du=cl01(1-Math.abs(e-2)/10)*.9,cg=S.cl/100*.5*dk;
 let tp=C([5,10,32],[50,130,230],dk),hr=C([18,28,66],[160,210,255],dk);
 tp=C(tp,[90,70,140],du*.6);hr=C(hr,[255,135,60],du);tp=C(tp,[125,135,150],cg);hr=C(hr,[175,180,190],cg);
 let g=X.createLinearGradient(0,0,0,H*.72);g.addColorStop(0,rgb(tp));g.addColorStop(1,rgb(hr));X.fillStyle=g;X.fillRect(0,0,W,H);
 if(dk<1){X.fillStyle='#fff';stars.forEach(s=>{X.globalAlpha=(1-dk)*(.4+.6*Math.abs(Math.sin(clock+s[2]*20)));X.fillRect(s[0]*W,s[1]*H*.6,1.8,1.8)});X.globalAlpha=1}
 const f=(S.t-6)/12,sx=W*(.08+.84*f),sy=H*.7-Math.sin(f*Math.PI)*H*.55;
 if(f>-.15&&f<1.15){g=X.createRadialGradient(sx,sy,0,sx,sy,200);g.addColorStop(0,`rgba(255,240,190,${.9*(1-cg)})`);g.addColorStop(.15,'rgba(255,210,110,.5)');g.addColorStop(1,'rgba(255,200,100,0)');X.fillStyle=g;X.fillRect(sx-200,sy-200,400,400);X.fillStyle='#fff7d6';X.beginPath();X.arc(sx,sy,26,0,7);X.fill()}
 X.fillStyle=`rgba(255,255,255,${.08+.3*dk})`;
 for(let i=0;i<S.cl/100*9;i++){const x=((i*.173+clock*.004)%1.2-.1)*W,y=H*(.1+(i*.37%.4));for(let k=0;k<4;k++){X.beginPath();X.ellipse(x+k*40,y+(k%2)*8,70,24,0,0,7);X.fill()}}
}
// ===== Фон: поле, ряды панелей в перспективе, тени =====
function ground(){
 const dk=cl01((M.e+5)/22),hy=H*.7,fs=(S.t-12)/6;
 const g=X.createLinearGradient(0,hy,0,H);g.addColorStop(0,rgb(C([8,16,24],[52,104,70],dk)));g.addColorStop(1,rgb(C([2,6,10],[20,56,36],dk)));X.fillStyle=g;X.fillRect(0,hy,W,H-hy);
 for(let r=0;r<5;r++){const s=.4+r*.28,y=hy+(H-hy)*(.06+r*.17),pw=100*s,ph=(10+40*S.tilt/90)*s;
  const pg=X.createLinearGradient(0,y-ph,0,y);pg.addColorStop(0,rgb(C([20,40,100],[120,180,240],dk*.85)));pg.addColorStop(1,rgb(C([8,18,50],[30,70,150],dk)));
  for(let x=-pw+(r*37)%pw;x<W;x+=pw*1.12){
   if(M.e>0){X.fillStyle=`rgba(0,0,0,${.25*dk})`;const o=-fs*ph*1.6;X.beginPath();X.moveTo(x,y);X.lineTo(x+pw,y);X.lineTo(x+pw+o,y+ph*.8);X.lineTo(x+o,y+ph*.8);X.fill()}
   X.fillStyle=pg;X.beginPath();X.moveTo(x+pw*.04,y-ph);X.lineTo(x+pw*.96,y-ph);X.lineTo(x+pw,y);X.lineTo(x,y);X.fill();X.strokeStyle='rgba(255,255,255,.35)';X.lineWidth=1;X.stroke()}}
}
// ===== Кристалл кремния крупно (шаг 3) =====
function lattice(lx,ly,lw,lh){
 X.fillStyle='rgba(8,20,60,.5)';rr(lx,ly,lw,lh,22);X.fill();X.strokeStyle='rgba(255,255,255,.35)';X.lineWidth=1.5;X.stroke();hit('lat',lx,ly,lw,lh);gl(step==3,lx,ly,lw,lh,22);
 tt('Кристалл кремния (крупно)',lx+16,ly+26,15);
 const at=(i,j)=>[lx+lw*(.1+.8*i/5),ly+lh*(.25+.6*j/3)],ph=(clock%4)/4,A=at(2,1),B=at(3,1),m=[(A[0]+B[0])/2,A[1]];
 for(let j=0;j<4;j++)for(let i=0;i<6;i++)[[1,0],[0,1]].forEach(([di,dj])=>{
  if(i+di>5||j+dj>3||(i==2&&j==1&&di==1&&ph>.25))return;const p=at(i,j),q=at(i+di,j+dj);
  X.strokeStyle='rgba(190,215,255,.5)';X.lineWidth=2;X.beginPath();X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1]);X.stroke();
  X.fillStyle='#7be9ff';X.beginPath();X.arc((p[0]+q[0])/2,(p[1]+q[1])/2,3,0,7);X.fill()});
 for(let j=0;j<4;j++)for(let i=0;i<6;i++){const p=at(i,j),g=X.createRadialGradient(p[0]-4,p[1]-4,1,p[0],p[1],15);g.addColorStop(0,'#cfe0ff');g.addColorStop(1,'#3a5aa0');X.fillStyle=g;X.beginPath();X.arc(p[0],p[1],14,0,7);X.fill();if(labels)tt('Si',p[0],p[1]+4,11,'center','#0b1b44')}
 if(ph<.22){const u=ph/.22,f0=Math.max(0,u-.2);X.strokeStyle='#ffd447';X.lineWidth=3.5;X.shadowColor='#ffb300';X.shadowBlur=14;X.beginPath();X.moveTo(mx(lx+24,A[0],f0),mx(ly+50,A[1],f0));X.lineTo(mx(lx+24,A[0],u),mx(ly+50,A[1],u));X.stroke();X.shadowBlur=0}
